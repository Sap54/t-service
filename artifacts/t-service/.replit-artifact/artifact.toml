kind = "web"
previewPath = "/"
title = "Т-СЕРВИС Landing Page"
version = "1.0.0"
id = "artifacts/t-service"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19910

[services.development]
run = "pnpm --filter @workspace/t-service run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/t-service", "run", "build" ]
publicDir = "artifacts/t-service/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19910"
BASE_PATH = "/"
